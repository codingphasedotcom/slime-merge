<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#263e2d"><title>Slime Merge</title><link rel="stylesheet" href="style.e9e87bcedc37.css"><script async src="https://runxr.app/sdk/runxr.js" onload="window.RunXR?.ready()"></script></head><body><main class="app"><canvas id="game" tabindex="0" aria-label="Slime battlefield. Arrows to choose a tile, Enter to merge, B to recruit."></canvas><header class="hud"><div class="wallet"><span class="coin">●</span><strong id="coins">100</strong></div><div class="boss-track"><div class="track-label"><span id="boss-label">BOSS INCOMING</span><span>WAVES <b id="waves">0</b></span></div><div class="meter" role="progressbar" aria-label="Zombie kills toward boss" aria-valuemin="0" aria-valuemax="20" aria-valuenow="0" id="boss-meter"><div id="boss-fill"></div><strong id="progress">0/20</strong><span class="crowned-skull"><span>♛</span>☠</span></div></div><button id="portal" aria-label="Open world portal">Portal</button><button id="pause" aria-label="Pause game">Ⅱ</button></header><div class="subhud"><span id="lives">♥ ♥ ♥ ♥ ♥</span><span id="wave">NEXT ZOMBIE · 5s</span></div><div class="game-title">SLIME <span>MERGE</span></div><section class="dock"><p id="message" role="status">Recruit a slime to defend your outpost.</p><div class="dock-row"><div class="score"><small>ZOMBIES</small><strong id="kills">0</strong></div><button id="buy"><span class="slime-icon">◕</span><span>RECRUIT SLIME<small id="outfit-label">LEVEL 1 · CAVEMAN</small></span><span class="price">● <b id="cost">50</b></span></button><button id="help" aria-label="How to play">?</button></div><span class="hint">Drag matching slimes to merge · B / X to recruit</span></section><div class="overlay" id="overlay" hidden><span class="eyebrow">SLIME MERGE</span><h2 id="overlay-title">Taking a breather.</h2><p id="overlay-text">Your outpost will be here when you’re ready.</p><button id="travel" hidden>Travel to the Moon →</button><button id="resume">Back to camp →</button><button id="exit" class="secondary">Exit to RunXR</button></div></main><script src="game.22a09d537e4c.js"></script></body></html>
